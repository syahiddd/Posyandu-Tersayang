<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Posyandu Tersayang">
  <!-- Lencana merek: bidang plum membulat, dibuat rata tanpa gradien agar
       tetap tajam di layar ponsel dan saat dicetak. -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="#4c2a3a"/>
  <rect x="11.5" y="11.5" width="105" height="105" rx="23" stroke="#d9a8bd" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Hati sebagai lambang kasih sayang. -->
  <path
    d="M64 84C61.4 82.1 35 62.7 35 44.4 35 33 44 25.6 53.8 28.4c4.6 1.3 8.3 4.6 10.2 8.8 1.9-4.2 5.6-7.5 10.2-8.8C84 25.6 93 33 93 44.4 93 62.7 66.6 82.1 64 84Z"
    fill="#fdf6ec"/>

  <!-- Tunas di dalam hati: tumbuh kembang anak. -->
  <path d="M64 73V53" stroke="#7f9a6d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M64 63c-3-8-10.5-11.5-18.5-9.5 1.5 8 8.5 12.5 18.5 9.5Z" fill="#9aaf8a"/>
  <path d="M64 55c3.5-8.5 11.5-11 19-8-1.5 8.5-9 12-19 8Z" fill="#7f9a6d"/>

  <!-- Lima titik untuk lima meja posyandu. -->
  <g fill="#e9ccd9">
    <circle cx="48" cy="100" r="2.6"/>
    <circle cx="56" cy="100" r="2.6"/>
    <circle cx="64" cy="100" r="2.6"/>
    <circle cx="72" cy="100" r="2.6"/>
    <circle cx="80" cy="100" r="2.6"/>
  </g>
</svg>
