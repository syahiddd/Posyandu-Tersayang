<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" fill="none" role="img" aria-label="Ilustrasi bayi yang ceria">
  <!-- Latar blush lembut, senada dengan referensi ungu-merah muda. -->
