  <ellipse cx="320" cy="198" rx="120" ry="14" fill="#f6d0e0"/>
  <circle cx="126" cy="54" r="5" fill="#e9a8c0"/>
  <circle cx="512" cy="166" r="5" fill="#e9a8c0"/>
  <circle cx="540" cy="56" r="4" fill="#e9a8c0"/>

  <!-- Hati kecil mengapung di kiri dan kanan. -->
  <path d="M204 78c0-7 5-12 11-12 4 0 7 2 9 5 2-3 5-5 9-5 6 0 11 5 11 12 0 12-20 23-20 23s-20-11-20-23Z" fill="#d98bab"/>
  <path d="M432 62c0-6 4-10 9-10 3 0 6 2 7 4 1-2 4-4 7-4 5 0 9 4 9 10 0 10-16 19-16 19s-16-9-16-19Z" fill="#e9a8c0"/>

