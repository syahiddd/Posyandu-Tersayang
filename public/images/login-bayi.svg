    <circle cx="337.5" cy="88.5" r="1.2" fill="#fff" stroke="none"/>
    <ellipse cx="290" cy="103" rx="8" ry="4.5" fill="#eda6b8" stroke="none"/>
    <ellipse cx="350" cy="103" rx="8" ry="4.5" fill="#eda6b8" stroke="none"/>
